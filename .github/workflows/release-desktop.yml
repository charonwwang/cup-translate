name: Release desktop
on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing source tag to release, e.g. v3.0.10'
                required: true
                type: string
            developer_id:
                description: 'Use Developer ID signing and Apple notarization (requires Apple secrets)'
                type: boolean
                default: false
permissions:
    contents: read
concurrency:
    group: desktop-public-release
    cancel-in-progress: false
env:
    RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    RELEASE_REPOSITORY: ${{ github.repository }}
    ESPEAK_STATIC_CRT: '1'
jobs:
    preflight:
        environment: macos-release
        runs-on: ubuntu-latest
        env:
            GITHUB_TOKEN: ${{ github.token }}
            TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        steps:
            - name: Validate release configuration before building
              shell: bash
              run: |
                  test -n "$GITHUB_TOKEN"
                  test -n "$TAURI_PRIVATE_KEY"
                  node --input-type=module <<'JS'
                  const {RELEASE_REPOSITORY: repo, RELEASE_TAG: tag, GITHUB_TOKEN: token} = process.env;
                  if(!/^v\d+\.\d+\.\d+$/.test(tag || '')) throw Error('Use a stable tag, for example v3.0.10');
                  if(!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo || '')) throw Error('Invalid download repository');
                  const response=await fetch(`https://api.github.com/repos/${repo}`, {signal:AbortSignal.timeout(30000),headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json'}});
                  if(!response.ok) throw Error(`Download repository unavailable: HTTP ${response.status}`);
                  const info=await response.json();
                  if(info.private) throw Error('The download repository must be public');
                  const branch=await fetch(`https://api.github.com/repos/${repo}/branches/${encodeURIComponent(info.default_branch)}`, {signal:AbortSignal.timeout(30000),headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json'}});
                  if(!branch.ok) throw Error('Initialize the public download repository with a README first');
                  JS
    windows-runtime:
        runs-on: windows-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Verify C++ engines can link with the static MSVC runtime
              run: node packaging/check-msvc-crt.mjs --verify-regression
    macos:
        needs: [preflight, windows-runtime]
        environment: macos-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-15
                      target: aarch64-apple-darwin
                      tauri_arch: aarch64
                      arch: arm64
                    - os: macos-15-intel
                      target: x86_64-apple-darwin
                      tauri_arch: x64
                      arch: x64
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        env:
            MACOSX_DEPLOYMENT_TARGET: '10.15'
            RELEASE_TARGET: ${{ matrix.target }}
            RELEASE_OUTPUT: release-assets
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.sha }}
                  persist-credentials: false
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Install build dependencies
              run: brew install cmake
            - name: Install dmgbuild for the standard drag-to-Applications layout
              run: |
                  python3 -m venv "$RUNNER_TEMP/dmgbuild"
                  "$RUNNER_TEMP/dmgbuild/bin/pip" install dmgbuild
                  echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"
            - run: pnpm install --frozen-lockfile
            - name: Check updater signing secret
              env:
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
              run: test -n "$TAURI_PRIVATE_KEY"
            - name: Prepare exact version and public update endpoint
              run: node packaging/prepare-macos-release.mjs
            - run: pnpm check
            - name: Import Developer ID certificate
              if: inputs.developer_id
              uses: apple-actions/import-codesign-certs@v3
              with:
                  p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
                  p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
            - name: Build signed app, DMG and updater artifacts
              if: inputs.developer_id
              env:
                  CI: 'true'
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  test -n "$APPLE_SIGNING_IDENTITY"
                  test -n "$APPLE_ID"
                  test -n "$APPLE_PASSWORD"
                  test -n "$APPLE_TEAM_ID"
                  pnpm tauri build --bundles dmg,updater --target "$RELEASE_TARGET"
                  mkdir -p release-assets
                  version="${RELEASE_TAG#v}"
                  cp src-tauri/target/$RELEASE_TARGET/release/bundle/dmg/*.dmg "release-assets/cup-translate_${version}_${{ matrix.tauri_arch }}.dmg"
                  cp src-tauri/target/$RELEASE_TARGET/release/bundle/macos/cup-translate.app.tar.gz "release-assets/cup-translate_${version}_${{ matrix.tauri_arch }}.app.tar.gz"
                  cp src-tauri/target/$RELEASE_TARGET/release/bundle/macos/cup-translate.app.tar.gz.sig "release-assets/cup-translate_${version}_${{ matrix.tauri_arch }}.app.tar.gz.sig"
                  codesign --verify --deep --strict src-tauri/target/$RELEASE_TARGET/release/bundle/macos/cup-translate.app
                  xcrun stapler validate src-tauri/target/$RELEASE_TARGET/release/bundle/macos/cup-translate.app
            - name: Build ad-hoc signed DMG and cryptographically signed updates
              if: ${{ !inputs.developer_id }}
              env:
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              run: |
                  pnpm tauri build --bundles app --target "$RELEASE_TARGET"
                  node packaging/package-macos.mjs "src-tauri/target/$RELEASE_TARGET/release/bundle/macos/cup-translate.app" --updater
            - name: Run native Rust regression tests
              run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --features custom-protocol --target "$RELEASE_TARGET"
            - name: Normalize macOS asset names
              run: |
                  version="${RELEASE_TAG#v}"
                  old="${{ matrix.tauri_arch }}"
                  new="${{ matrix.arch }}"
                  for suffix in dmg app.tar.gz app.tar.gz.sig; do
                      mv "release-assets/cup-translate_${version}_${old}.${suffix}" "release-assets/cup-translate_${version}_mac_${new}.${suffix}"
                  done
            - uses: actions/upload-artifact@v4
              with:
                  name: macos-release-${{ matrix.arch }}
                  path: release-assets/*
                  if-no-files-found: error
    windows:
        needs: [preflight, windows-runtime]
        environment: macos-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-pc-windows-msvc
                      arch: x64
                      msi: true
                    - target: i686-pc-windows-msvc
                      arch: x86
                      msi: true
                    - target: aarch64-pc-windows-msvc
                      arch: arm64
                      msi: false
        runs-on: windows-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - run: pnpm install --frozen-lockfile
            - run: node packaging/prepare-macos-release.mjs
            - run: pnpm test
            - name: Build Windows installers and signed updater
              shell: pwsh
              env:
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              run: |
                  $bundles = if ('${{ matrix.msi }}' -eq 'true') { 'nsis,msi,updater' } else { 'nsis,updater' }
                  pnpm tauri build --target '${{ matrix.target }}' --bundles $bundles
            - name: Run native Windows Rust regression tests
              if: matrix.arch == 'x64'
              run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --features custom-protocol --target '${{ matrix.target }}'
            - name: Normalize Windows asset names
              shell: pwsh
              run: |
                  $version = $env:RELEASE_TAG.TrimStart('v')
                  $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
                  New-Item -ItemType Directory -Force -Path release-assets | Out-Null
                  $exe = Get-ChildItem -Path "$bundle/nsis" -Filter '*-setup.exe' | Select-Object -First 1
                  Copy-Item $exe.FullName "release-assets/cup-translate_${version}_windows_${{ matrix.arch }}_setup.exe"
                  $zip = Get-ChildItem -Path "$bundle/nsis" -Filter '*-setup.nsis.zip' | Select-Object -First 1
                  Copy-Item $zip.FullName "release-assets/cup-translate_${version}_windows_${{ matrix.arch }}_setup.nsis.zip"
                  Copy-Item "$($zip.FullName).sig" "release-assets/cup-translate_${version}_windows_${{ matrix.arch }}_setup.nsis.zip.sig"
                  if ('${{ matrix.msi }}' -eq 'true') {
                      $msi = Get-ChildItem -Path "$bundle/msi" -Filter '*.msi' | Select-Object -First 1
                      Copy-Item $msi.FullName "release-assets/cup-translate_${version}_windows_${{ matrix.arch }}.msi"
                  }
            - uses: actions/upload-artifact@v4
              with:
                  name: windows-release-${{ matrix.arch }}
                  path: release-assets/*
                  if-no-files-found: error
    linux:
        needs: [preflight, windows-runtime]
        environment: macos-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      arch: x64
                      os: ubuntu-latest
                      toolchain: stable-x86_64-unknown-linux-gnu
                    - target: aarch64-unknown-linux-gnu
                      arch: arm64
                      os: ubuntu-24.04-arm
                      toolchain: stable-aarch64-unknown-linux-gnu
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: node packaging/prepare-macos-release.mjs
            - name: Build Linux bundles
              uses: ./.github/actions/build-for-linux
              env:
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              with:
                  target: ${{ matrix.target }}
                  toolchain: ${{ matrix.toolchain }}
            - name: Normalize Linux asset names
              run: |
                  version="${RELEASE_TAG#v}"
                  bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
                  mkdir -p release-assets
                  stage=$(mktemp -d)
                  cp "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$stage"/
                  tar -czf "release-assets/cup-translate_${version}_linux_${{ matrix.arch }}.tar.gz" -C "$stage" .
                  if [ "${{ matrix.arch }}" = "x64" ]; then
                      cp "$bundle"/appimage/*.AppImage.tar.gz "release-assets/cup-translate_${version}_linux_x64.AppImage.tar.gz"
                      cp "$bundle"/appimage/*.AppImage.tar.gz.sig "release-assets/cup-translate_${version}_linux_x64.AppImage.tar.gz.sig"
                  fi
            - uses: actions/upload-artifact@v4
              with:
                  name: linux-release-${{ matrix.arch }}
                  path: release-assets/*
                  if-no-files-found: error
    publish:
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        permissions:
            contents: write
        needs: [macos, windows, linux]
        environment: macos-release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: node packaging/prepare-macos-release.mjs
            - uses: actions/download-artifact@v4
              with:
                  pattern: '*-release-*'
                  path: release-assets
                  merge-multiple: true
            - name: Include exact corresponding source and GPL license
              run: |
                  version="${RELEASE_TAG#v}"
                  git ls-files -z | tar --null -T - -czf "release-assets/cup-translate_${version}_source.tar.gz"
            - name: Verify signatures and publish complete release
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: node updater/publish-desktop.mjs
