name: Verify desktop builds
on:
    push:
        branches: [master]
        paths:
            - 'src-tauri/**'
            - '.cargo/**'
            - 'src/**'
            - 'tests/**'
            - '.gitattributes'
            - 'public/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - '.github/actions/**'
            - 'packaging/**'
            - '.github/workflows/build-desktop.yml'
    workflow_dispatch:
        inputs:
            fedora_only:
                description: 'Build only Linux x64/ARM64 and verify the RPMs on Fedora 44'
                type: boolean
                default: false
env:
    ESPEAK_STATIC_CRT: '1'
permissions:
    contents: read
concurrency:
    group: desktop-build-${{ github.ref }}
    cancel-in-progress: true
jobs:
    macos:
        if: ${{ !inputs.fedora_only }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: aarch64-apple-darwin
                      os: macos-15
                    - target: x86_64-apple-darwin
                      os: macos-15-intel
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.10.1
            - uses: dtolnay/rust-toolchain@1.99.1
              with:
                  targets: ${{ matrix.target }}
            - run: pnpm install --frozen-lockfile
            - run: pnpm test
            - name: Build app without publishing
              env:
                  BUILD_TARGET: ${{ matrix.target }}
              run: |
                  pnpm tauri build --target "$BUILD_TARGET" --bundles app
                  ditto -c -k --keepParent "src-tauri/target/$BUILD_TARGET/release/bundle/macos/cup-translate.app" "verify-$BUILD_TARGET.zip"
            - uses: actions/upload-artifact@v4
              with:
                  name: verify-macos-${{ matrix.target }}
                  path: verify-${{ matrix.target }}.zip
                  if-no-files-found: error
    windows:
        if: ${{ !inputs.fedora_only }}
        runs-on: windows-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.10.1
            - uses: dtolnay/rust-toolchain@1.99.1
              with:
                  targets: ${{ matrix.target }}
            - run: pnpm install --frozen-lockfile
            - run: pnpm test
            - name: Build unsigned installer without publishing
              shell: pwsh
              run: |
                  pnpm tauri build --target '${{ matrix.target }}' -b nsis
            - uses: actions/upload-artifact@v4
              with:
                  name: verify-windows-${{ matrix.target }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
                  if-no-files-found: error
    linux:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(inputs.fedora_only && '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest"},{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-24.04-arm"}]' || '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest"},{"target":"i686-unknown-linux-gnu","os":"ubuntu-latest"},{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-24.04-arm"}]') }}
        steps:
            - uses: actions/checkout@v4
            - name: Build Debian and RPM packages without publishing
              uses: ./.github/actions/build-for-linux
              env:
                  BUILD_VERIFY_ONLY: 'true'
              with:
                  target: ${{ matrix.target }}
                  toolchain: stable
            - name: Install and launch RPM on Fedora 44
              if: matrix.target != 'i686-unknown-linux-gnu'
              run: bash packaging/verify-fedora-rpm.sh src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            - uses: actions/upload-artifact@v4
              with:
                  name: verify-linux-${{ matrix.target }}
                  path: |
                      src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
                      src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
                      src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
                  if-no-files-found: error
