name: Package
# Legacy multi-platform packaging is manual to avoid racing the macOS
# publisher on the same version release. Select a version tag when dispatching.
on:
    workflow_dispatch:
permissions:
    contents: write

jobs:
    change-version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.outputstep.outputs.VERSION }}
            signing: ${{ steps.signing.outputs.ENABLED }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install git
              run: |
                  sudo apt-get update
                  sudo apt-get install -y git
            - id: outputstep
              run: |
                  echo "VERSION=$(git describe --tags | sed -E 's/^v//; s/-[0-9]+-.*$//')" >> "$GITHUB_OUTPUT"
            - id: signing
              env:
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
              run: |
                  if [ -n "$TAURI_PRIVATE_KEY" ]; then echo 'ENABLED=true' >> "$GITHUB_OUTPUT"; fi
            - name: Change Version for Windows
              run: |
                  sed -i "s/\"version\":.*/\"version\": \"$(git describe --tags | sed -E 's/^v//; s/-[0-9]+-.*$//')\",/g" package.json

                  sed -i "s/\"version\":.*/\"version\": \"$(git describe --tags | sed -E 's/^v//; s/-[0-9]+-.*$//')\"/g" src-tauri/tauri.conf.json

                  sed -i -E "s/^version = \"[^\"]+\"/version = \"$(git describe --tags | sed -E 's/^v//; s/-[0-9]+-.*$//')\"/" src-tauri/Cargo.toml

                  git describe --tags | sed -E 's/^v//; s/-[0-9]+-.*$//'

            - name: Upload Artifacts for Windows
              uses: actions/upload-artifact@v4
              with:
                  name: source
                  path: |
                      .
                      !.git
                      !node_modules
                      !src-tauri/target
                  include-hidden-files: true
                  if-no-files-found: error

    build-extension:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Build Popclipext
              run: |
                  cd .scripts/popclip
                  bash ./build.sh
                  cd ../..
            - name: Build SnipDo
              run: |
                  cd .scripts/snipdo
                  bash ./build.sh
                  cd ../..
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: cup-translate.popclipextz
                  path: .scripts/popclip/cup-translate.popclipextz
                  if-no-files-found: error
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: cup-translate.pbar
                  path: .scripts/snipdo/cup-translate.pbar
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v3
              with:
                  make_latest: false
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: .scripts/popclip/cup-translate.popclipextz
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v3
              with:
                  make_latest: false
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: .scripts/snipdo/cup-translate.pbar

    build-for-macos:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-15
                      target: aarch64-apple-darwin
                    - platform: macos-15-intel
                      target: x86_64-apple-darwin

        runs-on: ${{ matrix.platform }}
        steps:
            # Keep Git metadata for source-integrity tests, then overlay the prepared version.
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Test
              run: pnpm test
            - name: Prepare bundled tools
              run: chmod +x src-tauri/resources/*
            - name: Build and Package
              run: |
                  export TAURI_PRIVATE_KEY="${{ secrets.TAURI_PRIVATE_KEY }}"
                  export TAURI_KEY_PASSWORD="${{ secrets.TAURI_KEY_PASSWORD }}"
                  export APPLE_SIGNING_IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
                  export APPLE_CERTIFICATE="${{ secrets.APPLE_CERTIFICATE }}"
                  export APPLE_CERTIFICATE_PASSWORD="${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
                  export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
                  export APPLE_API_ISSUER="${{ secrets.APPLE_API_ISSUER }}"
                  export APPLE_API_KEY="${{ secrets.APPLE_API_KEY }}"
                  export APPLE_ID="${{ secrets.APPLE_ID }}"
                  export APPLE_PASSWORD="${{ secrets.APPLE_PASSWORD }}"
                  if [ -n "$TAURI_PRIVATE_KEY" ]; then
                      pnpm tauri build -b dmg,updater --target ${{ matrix.target }}
                  else
                      pnpm tauri build -b dmg --target ${{ matrix.target }}
                  fi
            - name: Change File Name
              if: matrix.target == 'aarch64-apple-darwin'
              run: |
                  if [ -f src-tauri/target/aarch64-apple-darwin/release/bundle/macos/cup-translate.app.tar.gz ]; then
                      mv src-tauri/target/aarch64-apple-darwin/release/bundle/macos/cup-translate.app.tar.gz src-tauri/target/aarch64-apple-darwin/release/bundle/macos/cup-translate_${{needs.change-version.outputs.version}}_aarch64.app.tar.gz
                      mv src-tauri/target/aarch64-apple-darwin/release/bundle/macos/cup-translate.app.tar.gz.sig src-tauri/target/aarch64-apple-darwin/release/bundle/macos/cup-translate_${{needs.change-version.outputs.version}}_aarch64.app.tar.gz.sig
                  fi
            - name: Change File Name
              if: matrix.target == 'x86_64-apple-darwin'
              run: |
                  if [ -f src-tauri/target/x86_64-apple-darwin/release/bundle/macos/cup-translate.app.tar.gz ]; then
                      mv src-tauri/target/x86_64-apple-darwin/release/bundle/macos/cup-translate.app.tar.gz src-tauri/target/x86_64-apple-darwin/release/bundle/macos/cup-translate_${{needs.change-version.outputs.version}}_x64.app.tar.gz
                      mv src-tauri/target/x86_64-apple-darwin/release/bundle/macos/cup-translate.app.tar.gz.sig src-tauri/target/x86_64-apple-darwin/release/bundle/macos/cup-translate_${{needs.change-version.outputs.version}}_x64.app.tar.gz.sig
                  fi
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: macos_${{ matrix.target }}_dmg
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
                  if-no-files-found: error
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: macos_${{ matrix.target }}_updater
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
                  if-no-files-found: warn
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v3
              with:
                  make_latest: false
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v3
              with:
                  make_latest: false
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*

    build-for-windows:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [windows-latest]
                target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
                include:
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      toolchain: stable-x86_64-pc-windows-msvc
                    - os: windows-latest
                      target: i686-pc-windows-msvc
                      toolchain: stable-i686-pc-windows-msvc
                    - os: windows-latest
                      target: aarch64-pc-windows-msvc
                      toolchain: stable-aarch64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            # Keep Git metadata for source-integrity tests, then overlay the prepared version.
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
                  rustup toolchain install --force-non-host ${{ matrix.toolchain }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Test
              run: pnpm test
            - name: Build and Package
              run: |
                  $env:TAURI_PRIVATE_KEY="${{ secrets.TAURI_PRIVATE_KEY }}"
                  $env:TAURI_KEY_PASSWORD="${{ secrets.TAURI_KEY_PASSWORD }}"
                  if ($env:TAURI_PRIVATE_KEY) {
                      pnpm tauri build -b nsis,updater --target ${{ matrix.target }}
                  } else {
                      pnpm tauri build -b nsis --target ${{ matrix.target }}
                  }
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows_${{ matrix.target }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v3
              with:
                  make_latest: false
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*

    build-for-windows-fix-runtime:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [windows-latest]
                target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
                include:
                    - os: windows-latest
                      arch: x64
                      target: x86_64-pc-windows-msvc
                      toolchain: stable-x86_64-pc-windows-msvc
                    - os: windows-latest
                      arch: x86
                      target: i686-pc-windows-msvc
                      toolchain: stable-i686-pc-windows-msvc
                    - os: windows-latest
                      arch: arm64
                      target: aarch64-pc-windows-msvc
                      toolchain: stable-aarch64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            # Keep Git metadata for source-integrity tests, then overlay the prepared version.
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
                  rustup toolchain install --force-non-host ${{ matrix.toolchain }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Test
              run: pnpm test
            - name: Download WebView2 Runtime
              run: |
                  invoke-webrequest -uri https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab -outfile Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab
                  Expand .\Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab -F:* ./src-tauri
                  Remove-Item .\src-tauri\tauri.windows.conf.json
                  Rename-Item .\src-tauri\webview.${{ matrix.arch }}.json tauri.windows.conf.json
            - name: Build and Package
              run: |
                  $env:TAURI_PRIVATE_KEY="${{ secrets.TAURI_PRIVATE_KEY }}"
                  $env:TAURI_KEY_PASSWORD="${{ secrets.TAURI_KEY_PASSWORD }}"
                  if ($env:TAURI_PRIVATE_KEY) {
                      pnpm tauri build -b nsis,updater --target ${{ matrix.target }}
                  } else {
                      pnpm tauri build -b nsis --target ${{ matrix.target }}
                  }
                  Rename-Item .\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\cup-translate_${{needs.change-version.outputs.version}}_${{ matrix.arch }}-setup.exe cup-translate_${{needs.change-version.outputs.version}}_${{ matrix.arch }}_fix_webview2_runtime-setup.exe
                  if ($env:TAURI_PRIVATE_KEY) {
                      Rename-Item .\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\cup-translate_${{needs.change-version.outputs.version}}_${{ matrix.arch }}-setup.nsis.zip cup-translate_${{needs.change-version.outputs.version}}_${{ matrix.arch }}_fix_webview2_runtime-setup.nsis.zip
                      Rename-Item .\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\cup-translate_${{needs.change-version.outputs.version}}_${{ matrix.arch }}-setup.nsis.zip.sig cup-translate_${{needs.change-version.outputs.version}}_${{ matrix.arch }}_fix_webview2_runtime-setup.nsis.zip.sig
                  }
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows_fix_webview_runtime_${{ matrix.target }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v3
              with:
                  make_latest: false
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*

    build-for-linux:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [ubuntu-latest]
                target:
                    [
                        x86_64-unknown-linux-gnu,
                        i686-unknown-linux-gnu,
                        aarch64-unknown-linux-gnu,
                        armv7-unknown-linux-gnueabihf,
                    ]
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      toolchain: stable-x86_64-unknown-linux-gnu
                    - os: ubuntu-latest
                      target: i686-unknown-linux-gnu
                      toolchain: stable-i686-unknown-linux-gnu
                    - os: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      toolchain: stable-aarch64-unknown-linux-gnu
                    - os: ubuntu-latest
                      target: armv7-unknown-linux-gnueabihf
                      toolchain: stable-armv7-unknown-linux-gnueabihf
        runs-on: ${{ matrix.platform }}
        steps:
            # Keep Git metadata for source-integrity tests, then overlay the prepared version.
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Build for Linux
              uses: ./.github/actions/build-for-linux
              env:
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              with:
                  target: ${{ matrix.target }}
                  toolchain: ${{ matrix.toolchain }}
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux_${{ matrix.target }}_deb
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
                  if-no-files-found: error
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux_${{ matrix.target }}_rpm
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
                  if-no-files-found: error
            - name: Upload Artifacts
              if: matrix.target == 'x86_64-unknown-linux-gnu'
              uses: actions/upload-artifact@v4
              with:
                  name: linux_${{ matrix.target }}_appimage
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags') && matrix.target == 'x86_64-unknown-linux-gnu'
              uses: softprops/action-gh-release@v3
              with:
                  make_latest: false
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v3
              with:
                  make_latest: false
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v3
              with:
                  make_latest: false
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

    release-update:
        needs: [change-version, build-for-macos, build-for-windows, build-for-linux, build-for-windows-fix-runtime]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags') && needs.change-version.outputs.signing == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Install git
              run: |
                  sudo apt-get update
                  sudo apt-get install -y git curl
            - name: Get Tag Name
              run: |
                  echo "VERSION=$(git describe --tags | sed -E 's/^v//; s/-[0-9]+-.*$//')" >> $GITHUB_ENV
                  git describe --tags | sed -E 's/^v//; s/-[0-9]+-.*$//'
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: pnpm install
              run: pnpm install --frozen-lockfile
            - name: Release updater file
              run: |
                  pnpm run updater
                  pnpm run updater:fixRuntime
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.ref_name }}
            - name: Upload Release
              uses: softprops/action-gh-release@v3
              with:
                  make_latest: false
                  body: ${{env.VERSION}}
                  tag_name: updater
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: |
                      update.json
                      update-fix-runtime.json
