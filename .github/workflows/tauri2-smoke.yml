name: Verify Tauri 2 migration smoke
on:
    push:
        branches: ['codex/tauri2-migration']
        paths:
            - 'migration/tauri2-smoke/**'
            - '.github/workflows/tauri2-smoke.yml'
            - 'src-tauri/icons/**'
permissions:
    contents: read
concurrency:
    group: tauri2-smoke-${{ github.ref }}
    cancel-in-progress: true
jobs:
    desktop:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: macos-15, target: aarch64-apple-darwin, binary: cup-tauri2-smoke }
                    - { os: macos-15-intel, target: x86_64-apple-darwin, binary: cup-tauri2-smoke }
                    - { os: windows-latest, target: x86_64-pc-windows-msvc, binary: cup-tauri2-smoke.exe }
                    - { os: windows-latest, target: i686-pc-windows-msvc, binary: cup-tauri2-smoke.exe }
                    - { os: windows-latest, target: aarch64-pc-windows-msvc, binary: cup-tauri2-smoke.exe }
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - run: cargo build --locked --release --manifest-path migration/tauri2-smoke/Cargo.toml --target ${{ matrix.target }}
            - uses: actions/upload-artifact@v4
              with:
                  name: tauri2-smoke-${{ matrix.target }}
                  path: migration/tauri2-smoke/target/${{ matrix.target }}/release/${{ matrix.binary }}
                  if-no-files-found: error
    linux:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux/amd64 }
                    - { os: ubuntu-latest, target: i686-unknown-linux-gnu, platform: linux/386 }
                    - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux/arm64 }
        env:
            TARGET: ${{ matrix.target }}
            PLATFORM: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Build with native Debian WebKitGTK 4.1 packages
              shell: bash
              run: |
                  # Run checkout on the host; the i386 compiler runs in a native 32-bit userspace.
                  container_opts=()
                  if [ "$PLATFORM" = linux/386 ]; then
                      # Bookworm i386 uses legacy socketcall, which recent Docker profiles block.
                      # This job has a disposable hosted runner, no credentials and no host network.
                      container_opts+=(--security-opt seccomp=unconfined)
                  fi
                  docker run --rm --platform "$PLATFORM" "${container_opts[@]}" \
                      -v "$GITHUB_WORKSPACE:/work" -w /work -e TARGET \
                      rust:bookworm bash -euo pipefail -c '
                          test "$(rustc -vV | sed -n "s/^host: //p")" = "$TARGET"
                          apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=3 update
                          apt-get install -y --no-install-recommends pkg-config libwebkit2gtk-4.1-dev
                          cargo build --locked --release --manifest-path migration/tauri2-smoke/Cargo.toml --target "$TARGET"
                      '
            - uses: actions/upload-artifact@v4
              with:
                  name: tauri2-smoke-${{ matrix.target }}
                  path: migration/tauri2-smoke/target/${{ matrix.target }}/release/cup-tauri2-smoke
                  if-no-files-found: error
